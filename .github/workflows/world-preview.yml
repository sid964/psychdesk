name: Living World visual smoke
on:
  pull_request:
    paths:
      - 'world/**'
      - 'tests/world-navigation-browser.cjs'
      - '.github/workflows/world-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  living-world:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install lightweight Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/psychworld.log 2>&1 &
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
      - name: Render scene and check browser history
        run: |
          node --test tests/world-natural.test.cjs
          node tests/world-navigation-browser.cjs
      - name: Keep rendered screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-world-preview
          path: browser-audit-artifacts/world/
          retention-days: 7
