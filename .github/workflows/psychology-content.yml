name: Psychology public-content validation
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
  push:
    paths:
      - 'automation/data/curated-concepts.json'
      - 'automation/scripts/validate_concepts.py'
      - '.github/workflows/psychology-content.yml'
permissions:
  contents: read
jobs:
  validate-public-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python automation/scripts/validate_concepts.py
