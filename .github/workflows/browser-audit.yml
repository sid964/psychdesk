name: PsychDesk browser smoke (lightweight)
on:
  pull_request:
    paths:
      - 'index.html'
      - 'book-catalog.js'
      - 'book-reader.js'
      - 'book-reader.css'
      - 'book-reference.css'
      - 'tests/desktop-bookshelf-browser.cjs'
      - 'desktop-bookshelf.css'
      - 'fast-pdf-reader.js'
      - 'bio-book-index.js'
      - 'pdf-reader.js'
      - 'pdf-reader.css'
      - 'reader-studio.css'
      - 'tests/phase11-achievements-browser.cjs'
      - 'tests/pdf-reader-browser.cjs'
      - 'tests/book-reader-browser.cjs'
      - 'app.js'
      - 'sw.js'
      - 'firebase-sync.js'
      - 'motion-runtime.js'
      - 'sticky-notes.js'
      - 'reference-manager.js'
      - 'autopilot/**'
      - 'tests/repair-browser.cjs'
      - 'tests/release-upgrade-browser.cjs'
      - 'tests/phase2-browser.cjs'
      - 'tests/phase4-browser.cjs'
      - 'tests/phase6-browser.cjs'
      - 'study-clarity.css'
      - 'world/**'
      - 'psychopathology-*'
      - 'tests/world-*.cjs'
      - 'tests/psychopathology-*.cjs'
      - '.github/workflows/browser-audit.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'firebase-sync.js'
      - 'motion-runtime.js'
      - 'sticky-notes.js'
      - 'reference-manager.js'
      - 'autopilot/**'
      - 'tests/repair-browser.cjs'
      - 'tests/release-upgrade-browser.cjs'
      - 'tests/phase2-browser.cjs'
      - 'tests/phase4-browser.cjs'
      - 'tests/phase6-browser.cjs'
      - 'study-clarity.css'
      - 'world/**'
      - 'psychopathology-*'
      - 'tests/world-*.cjs'
      - 'tests/psychopathology-*.cjs'
      - '.github/workflows/browser-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psychdesk-browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install one browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/psychdesk-web.log 2>&1 &
          for n in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 1
          done
      - name: Desktop bookshelf, dictionary, Focus and native PDF smoke
        run: node tests/desktop-bookshelf-browser.cjs
      - name: Existing annotated PDF renderer smoke
        run: node tests/pdf-reader-browser.cjs
      - name: Attach screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psychdesk-browser-smoke
          path: browser-audit-artifacts/
          retention-days: 3
