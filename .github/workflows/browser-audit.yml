name: PsychDesk browser smoke (lightweight)
on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'firebase-sync.js'
      - 'motion-runtime.js'
      - 'sticky-notes.js'
      - 'reference-manager.js'
      - 'autopilot/**'
      - 'tests/repair-browser.cjs'
      - 'tests/release-upgrade-browser.cjs'
      - 'world/**'
      - 'psychopathology-*'
      - 'tests/world-*.cjs'
      - 'tests/psychopathology-*.cjs'
      - '.github/workflows/browser-audit.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'firebase-sync.js'
      - 'motion-runtime.js'
      - 'sticky-notes.js'
      - 'reference-manager.js'
      - 'autopilot/**'
      - 'tests/repair-browser.cjs'
      - 'tests/release-upgrade-browser.cjs'
      - 'world/**'
      - 'psychopathology-*'
      - 'tests/world-*.cjs'
      - 'tests/psychopathology-*.cjs'
      - '.github/workflows/browser-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psychdesk-browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install one browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/psychdesk-web.log 2>&1 &
          for n in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 1
          done
      - name: Responsive study persistence and offline routing smoke
        run: node tests/repair-browser.cjs
      - name: Prepare the preceding published release (read-only archive)
        run: |
          git fetch --no-tags --depth=1 origin 1fe8a2df41097d3b541e487d99bb4bd7e714e9cc
          mkdir -p /tmp/psychdesk-preceding
          git archive 1fe8a2df41097d3b541e487d99bb4bd7e714e9cc | tar -x -C /tmp/psychdesk-preceding
      - name: Old-cache upgrade, multi-tab and offline smoke
        run: node tests/release-upgrade-browser.cjs
      - name: World Back/Forward navigation smoke
        run: node tests/world-navigation-browser.cjs
      - name: Psychopathology graph interaction smoke
        run: node tests/psychopathology-browser.cjs
      - name: Full visual audit (manually requested only)
        if: github.event_name == 'workflow_dispatch'
        run: node tests/browser-audit.cjs
      - name: Attach screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psychdesk-browser-smoke
          path: browser-audit-artifacts/
          retention-days: 3
