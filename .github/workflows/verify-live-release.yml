name: Verify live PsychDesk release
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'study-clarity.css'
      - 'autopilot/studio.js'
      - 'psychopathology-graph.js'
      - 'psychopathology-graph.css'
      - 'world/**'
      - 'scripts/verify-live-release.cjs'
      - '.github/workflows/verify-live-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psychdesk-live-release-main
  cancel-in-progress: true
jobs:
  verify-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm critical study and World assets match this commit on Pages
        run: node scripts/verify-live-release.cjs
