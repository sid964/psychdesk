name: Verify live PsychDesk release
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'spatial-desk.css'
      - 'spatial-desk.js'
      - 'home-diorama.css'
      - 'autopilot/studio.js'
      - 'app.js'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Confirm first-paint gate, fresh shell and spatial garden are live
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://sid964.github.io/psychdesk'
          for attempt in $(seq 1 48); do
            query="release=$GITHUB_SHA&attempt=$attempt"
            html=$(curl -fsSL --max-time 12 "$SITE/index.html?$query" || true)
            sw=$(curl -fsSL --max-time 12 "$SITE/sw.js?$query" || true)
            studio=$(curl -fsSL --max-time 12 "$SITE/autopilot/studio.js?$query" || true)
            css=$(curl -fsSL --max-time 12 "$SITE/spatial-desk.css?$query" || true)
            js=$(curl -fsSL --max-time 12 "$SITE/spatial-desk.js?$query" || true)
            if [[ "$html" == *'psychdeskReady="loading"'* &&
                  "$html" == *'app.js?v=spatial-20261110-1'* &&
                  "$html" == *'spatial-desk.css?v=spatial-20261110-1'* &&
                  "$html" == *'spatial-desk.js?v=spatial-20261110-1'* &&
                  "$sw" == *'psychdesk-spatial-current-v79'* &&
                  "$sw" == *"cache:'no-store'"* &&
                  "$studio" == *"psychdeskReady='ready'"* &&
                  "$css" == *'prefers-reduced-motion:reduce'* &&
                  "$js" == *'deviceorientation'* ]]; then
              echo "LIVE_RELEASE_VERIFIED: gated first paint, fresh PWA shell and spatial garden are live"
              echo "RELEASE_COMMIT=$GITHUB_SHA"
              exit 0
            fi
            echo "Attempt $attempt: checking Pages propagation"
            sleep 8
          done
          echo "::error::Pages did not serve the current spatial and startup release"
          exit 1
