name: Verify live PsychDesk release
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-diorama.css'
      - 'autopilot/studio.js'
      - 'study-session.js'
      - 'app.js'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Confirm Pages serves the current home and startup cache
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://sid964.github.io/psychdesk'
          for attempt in $(seq 1 48); do
            query="release=$GITHUB_SHA&attempt=$attempt"
            html=$(curl -fsSL --max-time 12 "$SITE/index.html?$query" || true)
            sw=$(curl -fsSL --max-time 12 "$SITE/sw.js?$query" || true)
            studio=$(curl -fsSL --max-time 12 "$SITE/autopilot/studio.js?$query" || true)
            css=$(curl -fsSL --max-time 12 "$SITE/home-diorama.css?$query" || true)
            if [[ "$html" == *'app.js?v=desk-startup-20261110'* &&
                  "$html" == *'autopilot/studio.js?v=desk-startup-20261110'* &&
                  "$html" == *'home-diorama.css?v=desk-startup-20261110'* &&
                  "$sw" == *'psychdesk-study-adoption-neutral-desk-v78'* &&
                  "$sw" == *"cache:'no-store'"* &&
                  "$studio" == *'PICK UP WHERE YOU LEFT OFF'* &&
                  "$studio" == *'Open library'* &&
                  "$css" == *'Open study desk'* ]]; then
              echo "LIVE_RELEASE_VERIFIED: current desk and startup cache on Pages"
              echo "RELEASE_COMMIT=$GITHUB_SHA"
              exit 0
            fi
            echo "Attempt $attempt: Pages propagation pending"
            sleep 8
          done
          echo "::error::Pages did not serve the current home/startup release"
          exit 1
