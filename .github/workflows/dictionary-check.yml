name: Psychology dictionary checks
on:
  push:
    paths:
      - 'psychology-*.js'
      - 'psychology-*.css'
      - 'index.html'
      - 'sw.js'
      - 'tests/psychology-dictionary.test.cjs'
      - 'tests/psychology-online.test.cjs'
      - 'tests/study-extensions.test.cjs'
      - 'note-history.js'
      - 'psychology-connections.js'
      - 'psychology-academic.js'
      - 'study-connections.css'
      - 'cloud.js'
      - 'firebase-sync.js'
      - '.github/workflows/dictionary-check.yml'
  pull_request:
    paths:
      - 'psychology-*.js'
      - 'psychology-*.css'
      - 'index.html'
      - 'sw.js'
      - 'tests/psychology-dictionary.test.cjs'
      - '.github/workflows/dictionary-check.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check psychology-data.js
          node --check psychology-expanded-data.js
          node --check psychology-knowledge.js
          node --check psychology-imports.js
          node --check psychology-online.js
          node --check psychology-connections.js
          node --check psychology-academic.js
          node --check note-history.js
          node --check cloud.js
          node --check firebase-sync.js
      - name: Test psychology dictionary data and loading
        run: node --test tests/psychology-dictionary.test.cjs tests/psychology-online.test.cjs tests/study-extensions.test.cjs
